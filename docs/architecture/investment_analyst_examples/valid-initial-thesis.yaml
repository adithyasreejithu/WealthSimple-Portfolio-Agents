    narrative: >
      The market appears to price PLTR primarily on government-contract
      visibility; the faster-growing and more scalable story is commercial
      AIP adoption (ev_a1, ev_a4), which is not yet fully reflected in
      consensus estimates (ev_v2).
    evidence_ids: [ev_a1, ev_a4, ev_v2]
    capability_label: null
  expectations_and_results:
    narrative: >
      Last quarter beat consensus revenue by 4.1% (ev_e2) with commercial
      bookings the primary driver. Only the current analyst-estimate
      snapshot is available; revision-trend history is not yet persisted
      (Phase 8), so this section cannot characterize the direction of prior
      revisions beyond this one print.
    evidence_ids: [ev_e2]
    capability_label: current_snapshot_only
  options_and_positioning:
    narrative: >
      Put/call open interest is roughly balanced (ev_o1); no strong
      directional positioning signal. IV percentile and unusual-flow
      detection are not available (Phase 12).
    evidence_ids: [ev_o1]
    capability_label: snapshot_only
