  investment_case: >
    PLTR's government and commercial AIP bookings growth is real and
    broad-based across verticals (ev_a1, ev_a4), but current pricing already
    embeds several years of that growth continuing at its recent pace.
  case_against: >
    If AIP conversion decelerates even modestly, the current forward
    multiple leaves little room for a re-rating and would likely compress
    faster than revenue growth actually slows.
  most_important_catalyst: "Q3 FY2026 commercial bookings disclosure"
  most_important_risk: "Federal budget/appropriations timing risk to government segment"
  most_important_unknown: "Customer concentration within the top 10 commercial accounts (filing-derived; not yet collected — Phase 6)"
  analysis_horizon: Long-term
  as_of: 2026-08-09T14:00:00Z

key_claims:
  - claim_id: thesis_1
    statement: "Commercial AIP bookings are growing faster than the company's overall revenue growth rate, broadening the customer base beyond government."
    claim_type: fact
    importance: critical
    evidence_ids: [ev_a1, ev_a4]
    status_vs_prior: new
    confidence: high
  - claim_id: thesis_2
    statement: "Current valuation already prices in several years of AIP growth continuing at its recent pace, leaving limited multiple-expansion upside."
    claim_type: inference
    importance: critical
    evidence_ids: [ev_v2, ev_v3]
    status_vs_prior: new
    confidence: medium
  - claim_id: thesis_3
    statement: "Government segment carries appropriations-timing risk that is independent of commercial execution."
    claim_type: assumption
    importance: supporting
    evidence_ids: [ev_n1]
    status_vs_prior: new
    confidence: medium

