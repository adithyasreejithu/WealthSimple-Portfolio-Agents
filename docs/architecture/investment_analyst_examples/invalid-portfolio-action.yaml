# Example: INVALID investment-thesis.v1 — must be rejected by the Phase 1
# validator. Illustrates docs/architecture/investment_thesis_schema.md §2
# (forbidden fields) and is the required Phase 1 test fixture named in the
# roadmap's Phase 1 gate: "a fabricated evidence ID and a target_weight
# field both fail validation."
#
# This file intentionally combines THREE separate violations so each is
# easy to point at in a test assertion. A real invalid artifact from the
# analyst would likely have exactly one.
#
# Otherwise structurally identical to valid-initial-thesis.yaml; only the
# `conclusion` block and one evidence_id are altered.

