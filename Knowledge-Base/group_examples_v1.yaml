version: v1.0
name: group_examples
status: draft_for_review
purpose: >
  Few-shot examples showing how the rule-based classifier should explain
  portfolio group assignments.

examples:
  - ticker: XEQT
    expected_primary_group: Core
    expected_secondary_tags: [ETF, Global, Broad Market, CAD]
    explanation: >
      XEQT is broad global equity exposure and functions as a foundation holding,
      so it belongs in Core Market Exposure.

  - ticker: SCHD
    expected_primary_group: Income
    expected_secondary_tags: [ETF, Dividend, USD]
    explanation: >
      SCHD is a dividend-focused ETF, so its portfolio role is income and stability.

  - ticker: AAPL
    expected_primary_group: Quality
    expected_secondary_tags: [Equity, Technology, Quality, USD]
    explanation: >
      AAPL is a mature, profitable individual compounder. It is technology exposure,
      but the portfolio role is Quality rather than Growth.

  - ticker: NVDA
    expected_primary_group: Growth
    expected_secondary_tags: [Equity, Semiconductors, AI, High Volatility, USD]
    explanation: >
      NVDA is AI/semiconductor exposure with higher volatility and upside, so it is
      classified as Growth satellite exposure.

  - ticker: ZEB
    expected_primary_group: Income
    expected_secondary_tags: [ETF, Canadian Banks, CAD]
    explanation: >
      ZEB should be classified as Income because its portfolio role is Canadian
      bank income/stability, not Growth.

  - ticker: BRK
    expected_primary_group: Quality
    expected_secondary_tags: [Equity, Financials, Conglomerate, Quality, USD]
    explanation: >
      BRK should be Quality because it is a durable compounder, not Unclassified.

  - ticker: ZGLD
    expected_primary_group: Alternatives
    expected_secondary_tags: [ETF, Gold, Hedge, CAD]
    explanation: >
      ZGLD is gold/hedge exposure, so it belongs in Alternatives and should remain
      capped at a small allocation.
