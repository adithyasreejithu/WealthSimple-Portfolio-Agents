version: v1.1
name: manual_group_overrides
status: approved_reference
purpose: >
  User-approved ticker-level group assignments. These overrides have the
  highest priority in the classifier.

override_policy:
  priority: highest
  active_by_default: true
  notes:
    - Manual overrides represent the user's intended portfolio role.
    - Do not change an override automatically based only on sector metadata.
    - If a ticker's role changes, update this file explicitly.

