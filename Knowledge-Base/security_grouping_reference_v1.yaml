version: v1.0
name: security_grouping_reference
status: draft_for_review
purpose: >
  Reference taxonomy for sectors, industries, ETF categories, asset classes,
  themes, and default grouping biases. Used only after manual overrides,
  ETF rules, and portfolio-role rules.

asset_classes:
  equity:
    description: Individual company stock.
    eligible_primary_groups:
      - Income
      - Quality
      - Growth
      - Needs Review
  ETF:
    description: Exchange traded fund.
    eligible_primary_groups:
      - Core
      - Income
      - Growth
      - Alternatives
      - Needs Review
  commodity_etf:
    description: Commodity or gold-linked ETF.
    eligible_primary_groups:
      - Alternatives
  cash:
    description: Uninvested cash or settlement balance.
    eligible_primary_groups:
      - Cash

etf_categories:
  global_equity:
    primary_group_bias: Core
    examples:
      - XEQT
  broad_us_equity:
    primary_group_bias: Core
    examples:
      - VFV
      - SPLG
  broad_international_equity:
    primary_group_bias: Core
    examples:
      - INDA
  dividend_growth:
    primary_group_bias: Income
    examples:
      - DGRO
      - SCHD
  canadian_dividend:
    primary_group_bias: Income
    examples:
      - VDY
      - ZEB
  semiconductor:
    primary_group_bias: Growth
    examples:
      - SMH
      - DRAM
  gold:
    primary_group_bias: Alternatives
    examples:
      - ZGLD
      - GLD

sectors:
  Technology:
    common_industries:
      - Software
      - Semiconductors
      - Consumer Electronics
      - Information Technology Services
    default_group_bias:
      - Growth
      - Quality
    notes: >
      Mature profitable technology compounders can be Quality. Semiconductor,
      AI, or volatile high-upside names can be Growth.

  Communication Services:
    common_industries:
      - Internet Content & Information
      - Telecom Services
      - Entertainment
    default_group_bias:
      - Quality
      - Growth
      - Income
    notes: >
      Large profitable platforms may be Quality. Telecoms may be Income.

  Consumer Cyclical:
    common_industries:
      - Internet Retail
      - Auto Manufacturers
      - Restaurants
      - Travel Services
    default_group_bias:
      - Growth
      - Quality

  Consumer Defensive:
    common_industries:
      - Grocery Stores
      - Discount Stores
      - Household & Personal Products
      - Packaged Foods
    default_group_bias:
      - Income
      - Quality

  Financial Services:
    common_industries:
      - Banks
      - Asset Management
      - Insurance
      - Credit Services
    default_group_bias:
      - Income
      - Quality
    notes: >
      Canadian banks and dividend-oriented financial ETFs generally lean Income;
      high-quality compounders can be Quality.

  Industrials:
    common_industries:
      - Aerospace & Defense
      - Specialty Industrial Machinery
      - Railroads
      - Engineering & Construction
    default_group_bias:
      - Quality
      - Income
      - Growth

  Energy:
    common_industries:
      - Oil & Gas Midstream
      - Oil & Gas Integrated
      - Oil & Gas Exploration & Production
    default_group_bias:
      - Income
      - Growth
    notes: >
      Midstream/pipeline holdings lean Income. Commodity-sensitive growth names
      require explicit thesis and review.

  Healthcare:
    common_industries:
      - Biotechnology
      - Medical Care Facilities
      - Health Information Services
      - Drug Manufacturers
    default_group_bias:
      - Quality
      - Growth

  Utilities:
    common_industries:
      - Regulated Electric
      - Renewable Utilities
      - Diversified Utilities
    default_group_bias:
      - Income

  Real Estate:
    common_industries:
      - REITs
      - Real Estate Services
    default_group_bias:
      - Income

  Basic Materials:
    common_industries:
      - Gold
      - Copper
      - Specialty Chemicals
    default_group_bias:
      - Alternatives
      - Growth

tags:
  geography:
    - Canada
    - United States
    - Global
    - International
    - Emerging Markets
  currency:
    - CAD
    - USD
  themes:
    - AI
    - Semiconductors
    - Cloud
    - Defense
    - Dividend
    - Canadian Stability
    - Gold Hedge
    - Broad Market
  risk:
    - Core
    - Satellite
    - Speculative
    - Defensive
    - High Volatility
    - Needs Review
