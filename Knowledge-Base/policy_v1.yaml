version: v1.0
name: portfolio_grouping_policy
status: draft_for_review
purpose: >
  Defines the approved portfolio groups, target allocations, group intent,
  risk limits, and role-based meanings used by the portfolio classification
  agent. This file is a version-controlled policy reference. Runtime holdings,
  transactions, prices, and calculated allocations remain in DuckDB.

portfolio_model:
  name: Hybrid Core + Satellite
  philosophy: >
    ETF-first long-term portfolio structure with diversified core exposure,
    controlled income/stability positions, quality individual compounders,
    targeted growth themes, and small hedge/alternative exposure.
  classification_principle: portfolio_role_first_sector_second
  rebalance_style: periodic_or_drift_based
  avoid:
    - excessive_overlap
    - over_fragmentation
    - selling_core_compounders_to_fund_tactical_trades
    - letting_speculative_positions_distort_portfolio_structure

allocation_targets:
  Core:
    target_percent: 60
    min_percent: 55
    max_percent: 70
  Income:
    target_percent: 15
    min_percent: 10
    max_percent: 20
  Quality:
    target_percent: 15
    min_percent: 10
    max_percent: 20
  Growth:
    target_percent: 10
    min_percent: 5
    max_percent: 15
  Alternatives:
    target_percent: 5
    min_percent: 0
    max_percent: 5
  Cash:
    target_percent: null
    min_percent: 0
    max_percent: null
    note: Flexible operational bucket, not a strategic target group unless the user defines one.

groups:
  Core:
    canonical_name: Core Market Exposure
    role: Long-term foundation of the portfolio.
    description: >
      Broad diversified ETF/index exposure used as the main compounding base.
      Should represent the majority of the portfolio and should not be sold
      casually to fund tactical trades.
    objective: long_term_compounding
    risk_level: medium
    typical_holding_period: 5_plus_years
    expected_traits:
      - broad_market_exposure
      - diversified_across_sectors
      - diversified_across_regions_or_large_us_market
      - low_maintenance
      - suitable_for_regular_contributions
    not_this_group_if:
      - position_is_single_company
      - position_is_sector_concentrated
      - position_is_short_term_trade
      - position_is_bought_for_dividend_income_first
    examples:
      - XEQT
      - VFV
      - SPLG
      - INDA

  Income:
    canonical_name: Dividend / Canadian Stability
    role: Stable dividend and cash-flow-oriented holdings.
    description: >
      Holdings primarily owned for income, dividend growth, Canadian stability,
      or defensive cash-flow characteristics.
    objective: income_and_stability
    risk_level: low_to_medium
    typical_holding_period: 3_plus_years
    expected_traits:
      - consistent_dividends
      - stable_cash_flows
      - mature_business_model
      - reasonable_payout_ratio_when_available
      - Canadian income or dividend ETF exposure when applicable
    not_this_group_if:
      - thesis_is_primarily_high_growth
      - dividend_is_minor_or_not_part_of_reason_for_holding
      - position_is_speculative
    examples:
      - DGRO
      - SCHD
      - VDY
      - ENB
      - RY
      - TD
      - L
      - PZA
      - ZEB
      - T
      - WN

  Quality:
    canonical_name: Quality Individual Stocks
    role: High-quality individual compounders.
    description: >
      Durable individual companies with strong business quality, competitive
      advantages, strong financials, and long-term compounding potential.
    objective: quality_compounding
    risk_level: medium
    typical_holding_period: 3_to_5_plus_years
    expected_traits:
      - strong_balance_sheet
      - durable_competitive_advantage
      - strong_profitability
      - quality_management_or_capital_allocation
      - reasonable_long_term_growth
    not_this_group_if:
      - company_is_owned_mainly_for_income
      - company_is_small_speculative_or_unproven
      - holding_is_sector_or_theme_etf
    examples:
      - AAPL
      - MSFT
      - GOOGL
      - META
      - BRK
      - BN
      - RTX
      - NOC

  Growth:
    canonical_name: AI / Semiconductor / High-Growth Satellite
    role: Controlled higher-growth satellite exposure.
    description: >
      Higher-upside holdings tied to growth themes such as AI, semiconductors,
      software, health-tech, space, or other emerging opportunities. These can
      be more volatile and should remain within satellite limits.
    objective: capital_appreciation
    risk_level: high
    typical_holding_period: 1_to_5_years
    expected_traits:
      - above_average_growth_potential
      - exposure_to_clear_growth_theme
      - higher_volatility_accepted
      - smaller_allocation_than_core
      - thesis_requires_monitoring
    not_this_group_if:
      - position_is_broad_market_etf
      - position_is_income_first
      - position_lacks_clear_growth_thesis
    examples:
      - NVDA
      - PLTR
      - SMH
      - DRAM
      - AXTI
      - HIMS
      - NBIS

  Alternatives:
    canonical_name: Gold / Hedge / Alternative Assets
    role: Small hedge or low-correlation exposure.
    description: >
      Non-core assets used for diversification, hedge exposure, or lower
      correlation to equities. This group should stay small.
    objective: diversification_or_hedge
    risk_level: variable
    typical_holding_period: 1_to_5_plus_years
    expected_traits:
      - hedge_or_low_correlation_purpose
      - not_primary_growth_engine
      - capped_at_small_allocation
    not_this_group_if:
      - position_is_broad_equity_etf
      - position_is_single_company_growth_stock
      - position_is_income_first
    examples:
      - ZGLD
      - GLD

  Cash:
    canonical_name: Cash / Uninvested Capital
    role: Flexible liquidity and pending deployment.
    description: >
      Cash, deposits, pending settlement balances, and uninvested capital. This
      is tracked for portfolio completeness but not treated as a normal equity group.
    objective: liquidity
    risk_level: low
    typical_holding_period: flexible
    expected_traits:
      - uninvested_cash
      - pending_contribution
      - pending_deployment
    not_this_group_if:
      - asset_is_an_equity_or_etf
      - position_has_market_risk
    examples: []
