derived:
  - id: CURVE_US_10Y3M
    domain: rates
    op: spread
    inputs: [UST10Y, UST3M]
    align: locf
    max_carry_days: 5
    units: percent
    # Preferred 2s10s curve needs a genuine 2-year yield series, which
    # neither boc_valet nor a standard yfinance ticker confidently provides
    # -- add it (e.g. via FRED's DGS2) when a source is identified, and add
    # CURVE_US_2S10S alongside this one rather than replacing it.

  - id: VIX_TERM_STRUCTURE
    domain: volatility
    op: ratio
    inputs: [VIX, VIX3M]
    align: locf
    max_carry_days: 3
    units: ratio

  - id: CREDIT_HY_IG_RATIO
    domain: credit
    op: ratio
    inputs: [CREDIT_HYG, CREDIT_LQD]
    align: locf
    max_carry_days: 3
    units: ratio

