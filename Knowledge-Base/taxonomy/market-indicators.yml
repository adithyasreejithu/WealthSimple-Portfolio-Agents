# Market indicator registry for the market-analyst-resources skill.
#
# Hand-curated, owner-authored configuration -- read by the skill and by the
# (not-yet-built) market-researcher agent, never written by either. See
# docs/plans/market-analyst-resources-skill.md.
#
# Two tiers:
#   indicators -- leaves. Fetched from a named source. `series_id` (the `id`
#                 below) is the RAW, as-published series and is the
#                 permanent storage key in macro_observations -- renaming an
#                 id orphans its history. `transform` is applied at READ
#                 time, never at storage time, so changing a transform here
#                 never requires a backfill.
#   derived    -- composites (`spread`/`ratio` over exactly two leaf
#                 indicator ids). Depth is capped at 1: a derived entry may
#                 not reference another derived entry.
#   events     -- hand-maintained calendar (central bank meetings, major
#                 releases). Paste in the year's dates once from the
#                 official BoC/Fed schedules -- do not guess dates.
#
# Day-one coverage uses only free, no-key sources: Bank of Canada Valet
# (boc_valet) and yfinance. Domains that need a source with a key or a
# source not yet chosen are left as explicit <TBD> stubs at the bottom --
# they are skipped by the gate and refresh (registry.Indicator.is_configured
# is False), not treated as errors.
#
# VERIFY BEFORE FIRST LIVE RUN: entries below marked "verify:" carry an
# assumption (typically a yfinance scale convention) I could not fully
# confirm while authoring this file. Check the first live pull's raw value
# against a known-good source before trusting the transformed output.

version: 1
updated: 2026-08-05

sources:
  boc_valet:
    adapter: boc_valet
  yfinance:
    adapter: yfinance

indicators:
  # ---- policy ---------------------------------------------------------
  - id: BOC_POLICY_RATE
    domain: policy
    kind: statistical
    source: boc_valet
    series_ref: V39079          # Bank of Canada overnight rate target
    transform: none
    cadence: daily
    publication_lag_days: 0
    backfill_years: 5
    units: percent

  - id: FED_FUNDS_PROXY
    domain: policy
    kind: priced
    source: yfinance
    series_ref: "^IRX"          # 13-week T-bill discount rate, as a Fed policy proxy
    value_field: close
    scale: 1.0                  # verify: ^IRX is believed to already read in percent
    transform: none
    cadence: daily
    publication_lag_days: 0
    backfill_years: 2
    units: percent

